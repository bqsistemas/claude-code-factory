<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Board</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1424; --panel: #17213a; --col: #101a30; --ink: #f4f7fc; --muted: #94a3b8; --line: #263250;
    --pass: #4ade80; --pass-bg: #12372a; --changes: #fbbf24; --changes-bg: #3b2d0e;
    --pending: #a5b4fc; --alert: #fb923c; --alert-bg: #3a1f1c; --chip-bg: #1f2b48;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

  .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 22px 24px 6px; }
  .top h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .tag { font: 600 10px var(--mono); letter-spacing: .08em; padding: 2px 8px; border-radius: 999px;
         background: var(--changes-bg); color: var(--changes); }
  .status { color: var(--muted); font-size: 12px; margin-left: auto; }
  .status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                    background: var(--pass); margin-right: 6px; vertical-align: 1px; }
  .status.off::before { background: var(--alert); }

  /* 12 columns: the board scrolls sideways on wide screens and stacks on phones.
     Empty columns shrink so the busy ones (and Needs human) stay in view. */
  .board { display: flex; align-items: flex-start; gap: 14px; padding: 14px 24px 32px; overflow-x: auto; }
  .col { --accent: #a5b4fc; flex: 1 0 232px; min-width: 0; padding: 14px 12px 12px; border-radius: 16px;
         border: 1px solid var(--line);
         background: var(--col);
         background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 14%, var(--col)), var(--col) 70%);
         border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .col.tone-pending { --accent: #a5b4fc; }
  .col.tone-active { --accent: #1e6bff; }
  .col.tone-review { --accent: #8b5cf6; }
  .col.tone-done { --accent: #22c55e; }
  .col.tone-parked { --accent: #f87171; }
  .col.tone-muted { --accent: #64748b; }
  .col.quiet { flex: 0 0 128px; }
  @media (max-width: 640px)  { .board { flex-direction: column; align-items: stretch; overflow-x: visible; padding: 12px 16px 24px; }
                               .col, .col.quiet { flex: none; }
                               .top { padding: 18px 16px 4px; } }
  .parked { font-size: 12px; font-weight: 600; color: var(--alert); background: var(--alert-bg);
            padding: 2px 10px; border-radius: 999px; text-decoration: none; }
  .parked:hover, .parked:focus-visible { text-decoration: underline; }
  a:focus-visible, .file:focus-visible, .close:focus-visible, .doc:focus-visible { outline: 2px solid #dbe6ff; outline-offset: 2px; }
  .col h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 16px; font-weight: 700; color: var(--ink); }
  .lane-title { min-width: 0; overflow-wrap: anywhere; }
  .dot { flex: none; position: relative; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }
  .tone-done .dot::after { content: ""; position: absolute; left: 6px; top: 3px; width: 4px; height: 8px;
                           border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .count { margin-left: auto; flex: none; min-width: 24px; text-align: center; font: 600 12px var(--mono); padding: 2px 8px;
           border-radius: 999px; color: var(--ink); background: #0b1220;
           background: color-mix(in srgb, var(--accent) 22%, #0b1220);
           border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .col.alert { border-color: var(--alert); box-shadow: 0 0 0 1px var(--alert), 0 0 18px rgba(248,113,113,.35); }
  .col.alert h2 { color: var(--alert); }
  .col.quiet .lane { min-height: 24px; }
  .lane { display: flex; flex-direction: column; gap: 10px; min-height: 40px; }

  .card { position: relative; display: block; width: 100%; text-align: left; color: inherit; cursor: pointer;
          background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
          transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--muted); transform: translateY(-1px); }
  .card .open { display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; font: inherit;
                color: inherit; text-align: left; cursor: pointer; border-radius: 4px; }
  .card .open:focus-visible { outline: 2px solid #dbe6ff; outline-offset: 2px; }
  .card .open .id, .card .open .title { display: block; }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .card-top .open { flex: 1; min-width: 0; }
  .done-check { flex: none; position: relative; width: 20px; height: 20px; border-radius: 50%; background: #22c55e; }
  .done-check::after { content: ""; position: absolute; left: 7px; top: 3px; width: 4px; height: 9px;
                       border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .links { display: flex; flex-wrap: wrap; gap: 0 10px; margin: 2px 0; font-size: 11.5px; }
  .links .link { display: inline-flex; align-items: center; min-height: 24px; color: var(--muted); text-underline-offset: 2px; }
  .links .link:hover, .links .link:focus-visible { color: var(--ink); }
  .cost-time { display: flex; gap: 10px; font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .meta .when { white-space: nowrap; margin-left: auto; }
  .card.alert { border-color: var(--alert); box-shadow: 0 0 0 3px var(--alert-bg); }
  .card.merged { opacity: .9; }
  .id { font: 11px var(--mono); color: var(--muted); }
  .title { font-weight: 700; color: var(--ink); margin: 2px 0 4px; }
  .rounds { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .round { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .round .n { font: 10px var(--mono); color: var(--muted); width: 20px; }
  .chip { font-size: 10.5px; line-height: 16px; padding: 0 8px; border-radius: 999px;
          background: var(--chip-bg); color: var(--pending); border: 1px dashed var(--pending);
          background: color-mix(in srgb, var(--accent, #a5b4fc) 16%, var(--panel)); }
  .chip.PASS { background: var(--pass-bg); color: var(--pass); border: 1px solid transparent; }
  .chip.CHANGES { background: var(--changes-bg); color: var(--changes); border: 1px solid transparent; }
  .chip.FAIL { background: var(--alert-bg); color: var(--alert); border: 1px solid transparent; }
  .chip.gate { font-family: var(--mono); letter-spacing: .02em; }
  .chip.pending { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .4; } }
  .note { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .card.alert .note { color: var(--alert); }
  .cmd { display: inline-block; margin-top: 6px; font: 11px var(--mono); padding: 2px 8px; border-radius: 999px;
         background: var(--alert-bg); color: var(--alert); }
  .hint { display: block; margin-top: 6px; font-size: 11.5px; color: var(--alert); }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 64px 16px; }
  code { font: 12px var(--mono); background: var(--chip-bg); padding: 1px 5px; border-radius: 4px; }
  a { color: inherit; }

  .scrim { position: fixed; inset: 0; background: rgba(2,6,14,.6); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(760px, 100%); display: flex; flex-direction: column;
            background: var(--panel); border-left: 1px solid var(--line); box-shadow: -16px 0 48px rgba(0,0,0,.5);
            transform: translateX(100%); transition: transform .22s ease; }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
  .drawer-head .title { font-size: 16px; margin: 2px 0 0; }
  .close { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
           width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 22px; border-bottom: 1px solid var(--line); }
  .file { font: 11.5px var(--mono); padding: 3px 10px; border-radius: 999px; cursor: pointer;
          border: 1px solid var(--line); background: none; color: var(--ink); }
  .file[aria-selected="true"] { background: #1e6bff; color: #fff; border-color: #1e6bff; }
  .file.missing { opacity: .55; }
  .doc { flex: 1; overflow: auto; padding: 18px 26px 48px; }
  .doc h1, .doc h2, .doc h3 { line-height: 1.25; margin: 1.2em 0 .5em; }
  .doc h1 { font-size: 20px; } .doc h2 { font-size: 15px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--bg); padding: 12px 14px; border-radius: 8px; overflow: auto; border: 1px solid var(--line); }
  .doc pre code { background: none; padding: 0; }
  .doc table { border-collapse: collapse; font-size: 13px; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  .doc blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .verdict { display: inline-block; font: 600 12px var(--mono); letter-spacing: .04em; padding: 4px 10px; border-radius: 999px;
             background: var(--chip-bg); color: var(--pending); }
  .verdict.good { background: var(--pass-bg); color: var(--pass); }
  .verdict.warn { background: var(--changes-bg); color: var(--changes); }
  .verdict.bad  { background: var(--alert-bg); color: var(--alert); }
  .drawer-links { margin-top: 4px; }
  .missing-doc { color: var(--muted); font-style: italic; }

  .agents { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 4px; }
  .agent { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%;
           font-size: 10.5px; line-height: 16px; padding: 0 8px 0 2px; border-radius: 999px;
           background: var(--chip-bg); color: var(--ink); border: 1px solid var(--line);
           background: color-mix(in srgb, var(--accent, #a5b4fc) 18%, var(--panel));
           border-color: color-mix(in srgb, var(--accent, #a5b4fc) 40%, transparent); }
  .agent .avatar { flex: none; display: grid; place-items: center; width: 22px; height: 22px; }
  .agent .avatar svg { display: block; width: 22px; height: 22px; overflow: visible; }
  .agent-label { min-width: 0; overflow-wrap: anywhere; }
  /* Octopus characters from avatars.js: the body bobs, tentacles sway from their
     top, eyes blink now and then. Small amplitudes, slow loops. */
  .octo { animation: octo-bob 1.8s ease-in-out infinite; }
  .octo-tentacle { transform-box: fill-box; transform-origin: 50% 0;
                   animation: octo-sway 1.6s ease-in-out infinite alternate; }
  .octo-tentacle:nth-of-type(2n) { animation-delay: -.8s; }
  .octo-eye { transform-box: fill-box; transform-origin: center; animation: octo-blink 4.8s infinite; }
  .agent:nth-child(2) .octo, .agent:nth-child(2) .octo-eye { animation-delay: -.45s; }
  .agent:nth-child(3) .octo, .agent:nth-child(3) .octo-eye { animation-delay: -.9s; }
  .agent:nth-child(4) .octo, .agent:nth-child(4) .octo-eye { animation-delay: -1.35s; }
  @keyframes octo-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes octo-sway { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  @keyframes octo-blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @media (prefers-reduced-motion: reduce) {
    .agent, .agent .avatar, .chip.pending { animation: none; }
    .octo, .octo-tentacle, .octo-eye { animation: none; }
    .card, .col { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Software Factory</h1>
  <span class="tag" id="demo" hidden>DEMO</span>
  <a class="parked" id="parked" href="#col-needs-human" hidden></a>
  <span class="status" id="status">connecting…</span>
</header>
<main class="board" id="board"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><div class="id" id="d-id"></div><div class="title" id="d-title"></div><div class="drawer-links" id="d-links"></div></div>
    <button class="close" id="close" aria-label="Close">×</button>
  </div>
  <nav class="files" id="files" role="tablist"></nav>
  <article class="doc" id="doc" role="tabpanel" tabindex="0"></article>
</aside>

<script>
  // Module scripts cannot load over file://, so the board script below never runs there.
  if (location.protocol === 'file:') {
    const status = document.getElementById('status');
    status.className = 'status off';
    status.textContent = 'serve this folder: cd factory && python3 -m http.server 8000';
  }
</script>

<script type="module">
import {
  STAGE_COLUMNS, activeAgents, agentsHtml, costTimeHtml, laneTone, linksHtml, roundChipsHtml,
} from './activity.js';

const DEMO = new URLSearchParams(location.search).has('demo');
const BASE = DEMO ? 'demo/' : '';
const REVIEWERS = ['security', 'ux', 'ui', 'code'];
const ALERT = new Set(['needs-human', 'needs-info']);
const DONE = new Set(['merged', 'rejected']);

const I18N = JSON.parse(document.getElementById('i18n').textContent);
let board = { jobs: [] }, lastText = '', openJob = null, openFile = null;
const cache = new Map();
// Board data only selects a dictionary key; it is never interpolated as markup.
let T = I18N.en;
function setLanguage() {
  const lang = Object.hasOwn(I18N, board.language) ? board.language : 'en';
  T = I18N[lang];
  document.documentElement.lang = lang;
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (!iso || isNaN(s)) return '';
  if (s < 60) return `${Math.round(s)}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

// One row per round: history first, then the current round once it has a gate.
function roundsOf(job) {
  const rows = (Array.isArray(job.history) ? job.history : []).filter(r => r && typeof r === 'object');
  const reviews = job.reviews && typeof job.reviews === 'object' ? job.reviews : {};
  if (job.round >= 1 && (job.gate || Object.keys(reviews).length)) rows.push({ gate: job.gate, reviews });
  return rows;
}

function card(job) {
  const alert = job.stage === 'needs-human';
  const running = activeAgents(job).length > 0;
  const rows = roundsOf(job).map((r, i) =>
    `<div class="round"><span class="n">R${i + 1}</span>${roundChipsHtml(r)}</div>`).join('');
  const issue = Number.isInteger(job.issue) && job.issue > 0 ? job.issue : '';
  return `<article class="card ${alert ? 'alert' : ''} ${DONE.has(job.stage) ? 'merged' : ''} ${running ? 'running' : ''}" data-id="${esc(job.id)}">
    <div class="card-top">
      <button class="open" data-id="${esc(job.id)}" aria-label="Open ${esc(job.id)}">
        <span class="id">${esc(job.id)}</span>
        <span class="title">${esc(job.title || job.id)}</span>
      </button>
      ${job.stage === 'merged' ? '<span class="done-check" aria-hidden="true"></span>' : ''}
    </div>
    ${linksHtml(job, board.repo)}
    ${agentsHtml(job)}
    ${rows ? `<div class="rounds">${rows}</div>` : ''}
    ${job.note ? `<div class="note">${esc(job.note)}</div>` : ''}
    ${alert ? `<span class="hint">${job.pr ? T.hintNeedsHumanPr : T.hintNeedsHumanNoPr}</span>
      ${issue ? `<code class="cmd">/factory rework ${esc(issue)}</code>` : ''}` : ''}
    ${job.stage === 'awaiting-merge' ? `<span class="hint">${T.hintAwaitingMerge}</span>` : ''}
    ${job.stage === 'needs-info' && !job.note ? `<span class="hint">${T.hintNeedsInfo}</span>` : ''}
    <div class="meta"><span class="cost-time">${costTimeHtml(job)}</span>
      <span class="when">${job.round ? `round ${esc(job.round)}/${esc(job.max_rounds ?? 3)} · ` : ''}${ago(job.updated)}</span></div>
  </article>`;
}

function render() {
  setLanguage();
  const jobs = board.jobs || [];
  if (!jobs.length) {
    $('board').innerHTML = `<div class="empty">${T.emptyBoard}
      ${DEMO ? '' : `<br><br>${T.demoLink}`}</div>`;
    return;
  }
  const known = new Set(STAGE_COLUMNS.map(s => s[0]));
  $('board').innerHTML = STAGE_COLUMNS.map(([key, fallback]) => {
    const label = T.columns[key] || fallback;
    const list = jobs.filter(j => (known.has(j.stage) ? j.stage : 'intake') === key);
    return `<section class="col tone-${laneTone(key)} ${ALERT.has(key) && list.length ? 'alert' : ''} ${list.length ? '' : 'quiet'}" id="col-${esc(key)}" aria-label="${esc(label)}">
      <h2><span class="dot" aria-hidden="true"></span><span class="lane-title">${label}</span><span class="count">${list.length}</span></h2>
      <div class="lane">${list.map(card).join('')}</div></section>`;
  }).join('');
  const human = jobs.filter(j => j.stage === 'needs-human').length;
  const info = jobs.filter(j => j.stage === 'needs-info').length;
  const parked = $('parked');
  parked.hidden = !(human + info);
  parked.href = human ? '#col-needs-human' : '#col-needs-info';
  parked.textContent = [human && T.parkedHuman.replace('{n}', human).replace('{s}', human === 1 ? 's' : ''), info && T.parkedInfo.replace('{n}', info)]
    .filter(Boolean).join(' · ');
}

async function poll() {
  try {
    const res = await fetch(BASE + 'board.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 404 ? 'no board.json yet. Run /factory run to create it' : `HTTP ${res.status}`);
    const text = await res.text();
    const status = $('status');
    status.className = 'status';
    if (text !== lastText) {
      board = JSON.parse(text);   // a half-written file throws and keeps the last good board
      lastText = text;
      render();
      if (openJob) { cache.clear(); openDrawer(openJob, openFile); }
    }
    status.textContent = `live · updated ${ago(board.updated) || 'just now'}`;
  } catch (err) {
    if (err instanceof SyntaxError && lastText) return;   // mid-write; try again next poll
    const status = $('status');
    status.className = 'status off';
    status.textContent = location.protocol === 'file:'
      ? 'serve this folder: cd factory && python3 -m http.server 8000'
      : String(err.message || err);
    if (!lastText) render();
  }
}

// --- drawer -----------------------------------------------------------------

function filesOf(job) {
  const files = ['issue.md', 'intake.md', 'spec.md', 'build.md'];
  roundsOf(job).forEach((r, i) => {
    files.push(`round-${i + 1}/checks.md`);
    const reviews = r.reviews && typeof r.reviews === 'object' ? r.reviews : {};
    const keys = [...REVIEWERS.filter(k => k in reviews), ...Object.keys(reviews).filter(k => !REVIEWERS.includes(k))];
    keys.forEach(k => files.push(`round-${i + 1}/review-${k}.md`));
  });
  files.push('decision.md', 'merge-checks.md');
  return files;
}

async function load(job, file) {
  const key = `${job.id}/${file}`;
  if (!cache.has(key)) {
    cache.set(key, fetch(`${BASE}jobs/${encodeURIComponent(job.id)}/${file}`, { cache: 'no-store' })
      .then(r => (r.ok ? r.text() : null)).catch(() => null));
  }
  return cache.get(key);
}

let returnFocus = null;

async function openDrawer(id, file) {
  const job = (board.jobs || []).find(j => j.id === id);
  if (!job) return closeDrawer();
  const opening = !$('drawer').classList.contains('open');
  if (opening) returnFocus = document.activeElement;
  openJob = id;
  $('d-id').textContent = `${job.id} · ${job.branch || ''} · ${job.stage}`;
  $('d-title').textContent = job.title || job.id;
  $('d-links').innerHTML = linksHtml(job, board.repo);
  const files = filesOf(job);
  const texts = await Promise.all(files.map(f => load(job, f)));
  if (openJob !== id) return;
  const existing = files.filter((f, i) => texts[i] !== null);
  openFile = file && files.includes(file) ? file : existing[existing.length - 1] || files[0];
  $('files').innerHTML = files.map((f, i) =>
    `<button class="file ${texts[i] === null ? 'missing' : ''}" role="tab" data-file="${esc(f)}" aria-controls="doc"
      aria-selected="${f === openFile}" tabindex="${f === openFile ? 0 : -1}">${esc(f)}</button>`).join('');
  const text = texts[files.indexOf(openFile)];
  $('doc').innerHTML = text === null ? `<p class="missing-doc">${T.notWritten}</p>` : md(text);
  $('drawer').classList.add('open');
  $('drawer').setAttribute('aria-hidden', 'false');
  $('scrim').classList.add('open');
  if (opening) $('close').focus();
}

function closeDrawer() {
  const wasOpen = $('drawer').classList.contains('open');
  openJob = openFile = null;
  $('drawer').classList.remove('open');
  $('drawer').setAttribute('aria-hidden', 'true');
  $('scrim').classList.remove('open');
  if (wasOpen && returnFocus && document.contains(returnFocus)) returnFocus.focus();
  returnFocus = null;
}

$('board').addEventListener('click', e => {
  if (e.target.closest('a')) return;   // issue and PR links open GitHub
  const c = e.target.closest('.card');
  if (c) openDrawer(c.dataset.id);
});
$('files').addEventListener('click', e => {
  const f = e.target.closest('.file');
  if (f) openDrawer(openJob, f.dataset.file);
});
$('files').addEventListener('keydown', async e => {   // arrow keys move between tabs
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const tabs = [...$('files').querySelectorAll('.file')];
  const i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length].dataset.file;
  await openDrawer(openJob, next);
  $('files').querySelector(`[data-file="${CSS.escape(next)}"]`)?.focus();
});
$('close').addEventListener('click', closeDrawer);
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// --- tiny markdown renderer (headings, lists, tables, code, quotes) ---------

const TONE = {
  PASS: 'good', APPROVE: 'good', READY: 'good', ACCEPT: 'good',
  CHANGES: 'warn', 'NEEDS-INFO': 'warn', ESCALATE: 'bad', BLOCKED: 'bad', FAIL: 'bad', REJECT: 'bad',
};

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
      /^(https?:\/\/|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : m);
}

function table(rows) {
  const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(cells);
  const [head, ...rest] = body;
  return `<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead>
    <tbody>${rest.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  const LIST = /^\s*([-*]|\d+\.)\s+/;
  const START = /^(```|#{1,4}\s|\s*\||>|-{3,}\s*$)/;
  let i = 0;
  const first = (lines[0] || '').match(/^(?:(VERDICT|STATUS|GATE):\s*)?(PASS|FAIL|CHANGES|APPROVE|ESCALATE|READY|BLOCKED|ACCEPT|NEEDS-INFO|REJECT)(?![\w-])/);
  if (first) { out.push(`<span class="verdict ${TONE[first[2]]}">${esc(lines[0])}</span>`); i = 1; }
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (!l.trim()) { i++; continue; }
    if (/^```/.test(l)) {
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
    } else if ((m = l.match(/^(#{1,4})\s+(.*)/))) {
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++;
    } else if (/^-{3,}\s*$/.test(l)) {
      out.push('<hr>'); i++;
    } else if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push(table(rows));
    } else if (LIST.test(l)) {
      const tag = /^\s*\d+\./.test(l) ? 'ol' : 'ul', items = [];
      while (i < lines.length && LIST.test(lines[i])) items.push(lines[i++].replace(LIST, ''));
      out.push(`<${tag}>${items.map(t => `<li>${inline(t).replace(/^\[([ xX])\]\s/, (_, c) => (c === ' ' ? '☐ ' : '☑ '))}</li>`).join('')}</${tag}>`);
    } else if (/^>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`);
    } else {
      const buf = [l];
      for (i++; i < lines.length && lines[i].trim() && !START.test(lines[i]) && !LIST.test(lines[i]); i++) buf.push(lines[i]);
      out.push(`<p>${inline(buf.join(' '))}</p>`);
    }
  }
  return out.join('\n');
}
