<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Board</title>
<script id="theme-init">
(function () {
  var KEY = 'factory-theme';
  var root = document.documentElement;
  function stored() {
    try { var v = window.localStorage.getItem(KEY); return v === 'light' || v === 'navy' ? v : null; }
    catch (e) { return null; }
  }
  function os() {
    try { return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'navy'; }
    catch (e) { return 'navy'; }
  }
  function apply(t) { root.setAttribute('data-theme', t); }
  window.factoryTheme = {
    current: function () { return root.getAttribute('data-theme') === 'light' ? 'light' : 'navy'; },
    set: function (t) {
      if (t !== 'light' && t !== 'navy') return;
      apply(t);
      try { window.localStorage.setItem(KEY, t); } catch (e) { /* storage unavailable: keep the choice for this visit */ }
    },
  };
  apply(stored() || os());
})();
</script>
<style>
  /* Two themes share every shape. Navy is the default; the head script sets
     data-theme="light" or "navy" before the board renders. */
  :root, :root[data-theme="navy"] {
    color-scheme: dark;
    --bg: #0d1424; --panel: #17213a; --col: #101a30; --ink: #f4f7fc; --muted: #94a3b8; --line: #263250;
    --pass: #4ade80; --pass-bg: #12372a; --changes: #fbbf24; --changes-bg: #3b2d0e;
    --pending: #a5b4fc; --alert: #fb923c; --alert-bg: #3a1f1c; --chip-bg: #1f2b48;
    --focus: #dbe6ff; --count-base: #0b1220; --scrim: rgba(2,6,14,.6); --shadow: rgba(0,0,0,.5);
    --active: #1e6bff; --done: #22c55e; --on-accent: #fff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f5fa; --panel: #ffffff; --col: #eef2fa; --ink: #0f172a; --muted: #475569; --line: #cfd7e8;
    --pass: #166534; --pass-bg: #dcfce7; --changes: #92400e; --changes-bg: #fef3c7;
    --pending: #4338ca; --alert: #b91c1c; --alert-bg: #fee2e2; --chip-bg: #e6ebf7;
    --focus: #1e3a8a; --count-base: #ffffff; --scrim: rgba(15,23,42,.35); --shadow: rgba(15,23,42,.2);
  }
  * { box-sizing: border-box; }
  /* One page: the body fills the viewport; lanes scroll inside, never the page. */
  body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         height: 100vh; height: 100dvh; overflow: hidden;
         font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; flex: none; padding: 10px 16px 2px; }
  .top h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .tag { font: 600 11px var(--mono); letter-spacing: .08em; padding: 2px 8px; border-radius: 999px;
         background: var(--changes-bg); color: var(--changes); }
  .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
                  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
                  font-size: 14px; cursor: pointer; align-self: center; }
  .theme-toggle:hover { border-color: var(--muted); }
  .theme-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .status { color: var(--muted); font-size: 12px; margin-left: auto; }
  .status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                    background: var(--pass); margin-right: 6px; vertical-align: 1px; }
  .status.off::before { background: var(--alert); }

  /* 12 columns: the board scrolls sideways on wide screens and stacks on phones.
     Empty columns shrink so the busy ones (and Needs human) stay in view. */
  .board { display: flex; align-items: stretch; gap: 8px; flex: 1; min-height: 0; padding: 8px 16px 12px;
           overflow-x: auto; overflow-y: hidden; }
  .col { --accent: var(--pending); display: flex; flex-direction: column; flex: 1 1 0; min-width: 180px; min-height: 0;
         padding: 8px 8px 8px; border-radius: 14px;
         border: 1px solid var(--line);
         background: var(--col);
         background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 14%, var(--col)), var(--col) 70%);
         border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .col.tone-pending { --accent: var(--pending); }
  .col.tone-active { --accent: #1e6bff; }
  .col.tone-review { --accent: #8b5cf6; }
  .col.tone-done { --accent: #22c55e; }
  .col.tone-parked { --accent: #f87171; }
  .col.tone-muted { --accent: #64748b; }
  .col.quiet { flex: 0 0 auto; width: 44px; min-width: 0; padding: 8px 4px; align-items: center; }
  .col.quiet h2 { writing-mode: vertical-rl; margin: 0; font-size: 13px; }
  .col.quiet .count { margin-left: 0; }
  /* Header stat tiles. */
  .stats { display: flex; gap: 8px; align-self: center; flex-wrap: wrap; }
  .stat { display: inline-flex; align-items: baseline; gap: 6px; padding: 2px 10px; border-radius: 999px;
          background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .stat .v { font: 700 13px var(--mono); color: var(--ink); }

  /* Agent Office and the reserved Pipeline panel: two equal halves above the kanban. */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: none; height: clamp(260px, 50vh, 480px);
            padding: 8px 16px 0; }
  .panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 8px; border-radius: 14px;
           background: var(--col); border: 1px solid var(--line); }
  .panel h2 { margin: 0 0 6px; flex: none; font-size: 14px; font-weight: 700; color: var(--ink); }
  .office-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #office-canvas { display: block; image-rendering: pixelated; }
  #office-hits { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .hit { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; z-index: 1; }
  .hit-token { z-index: 2; }
  .hit-agent { z-index: 3; }
  .hit:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
                     overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 900px) {
    .panels { grid-template-columns: 1fr; height: auto; }
    /* Stacked: the map keeps scale 2 or more (tags stay legible) and scrolls sideways inside the panel if needed. */
    .office-stage { display: block; flex: none; width: 100%; overflow-x: auto; }
    #office-canvas { margin: 0 auto; }
    .panel.pipeline { min-height: 80px; }
  }
  @media (max-width: 640px) {
    body { display: block; height: auto; overflow: visible; }
    .board { flex-direction: column; align-items: stretch; overflow-x: visible; overflow-y: visible; padding: 8px 12px 16px; }
    .col, .col.quiet { flex: none; width: auto; min-width: 0; }
    .col.quiet { flex-direction: row; padding: 8px; }
    .col.quiet h2 { writing-mode: horizontal-tb; }
    .col.quiet .count { margin-left: auto; }
    .lane { overflow-y: visible; }
    .top { padding: 10px 12px 2px; }
  }
  .parked { font-size: 12px; font-weight: 600; color: var(--alert); background: var(--alert-bg);
            padding: 2px 10px; border-radius: 999px; text-decoration: none; }
  .parked:hover, .parked:focus-visible { text-decoration: underline; }
  a:focus-visible, .file:focus-visible, .close:focus-visible, .doc:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .col h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; flex: none; font-size: 14px; font-weight: 700; color: var(--ink); }
  .lane-title { min-width: 0; overflow-wrap: normal; }
  .dot { flex: none; position: relative; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  .tone-done .dot::after { content: ""; position: absolute; left: 4px; top: 2px; width: 3px; height: 7px;
                           border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .count { margin-left: auto; flex: none; min-width: 22px; text-align: center; font: 600 12px var(--mono); padding: 1px 6px;
           border-radius: 999px; color: var(--ink); background: var(--count-base);
           background: color-mix(in srgb, var(--accent) 22%, var(--count-base));
           border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .col.alert { border-color: var(--alert); box-shadow: 0 0 0 1px var(--alert), 0 0 18px color-mix(in srgb, var(--alert) 40%, transparent); }
  .col.alert h2 { color: var(--alert); }
  .lane { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; overflow-y: auto; }

  .card { position: relative; display: block; width: 100%; text-align: left; color: inherit; cursor: pointer;
          background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; flex: none;
          transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--muted); transform: translateY(-1px); }
  .card .open { display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; font: inherit;
                color: inherit; text-align: left; cursor: pointer; border-radius: 4px; }
  .card .open:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .card .open .id, .card .open .title { display: block; }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .card-top .open { flex: 1; min-width: 0; }
  .done-check { flex: none; position: relative; width: 20px; height: 20px; border-radius: 50%; background: var(--done); }
  .done-check::after { content: ""; position: absolute; left: 7px; top: 3px; width: 4px; height: 9px;
                       border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .links { display: flex; flex-wrap: wrap; gap: 0 10px; margin: 0; font-size: 11.5px; }
  .links .link { display: inline-flex; align-items: center; min-height: 22px; color: var(--muted); text-underline-offset: 2px; }
  .links .link:hover, .links .link:focus-visible { color: var(--ink); }
  .cost-time { display: flex; gap: 10px; font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .meta .when { white-space: nowrap; margin-left: auto; }
  .card.alert { border-color: var(--alert); box-shadow: 0 0 0 3px var(--alert-bg); }
  .card.merged { opacity: .9; }
  .older { container-type: inline-size; flex: none; border: 1px solid var(--line); border-radius: 10px; background: var(--col); }
  .older summary { cursor: pointer; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 10px; }
  .older[open] summary { color: var(--ink); }
  .rows { list-style: none; margin: 0; padding: 0 4px 4px; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: baseline; gap: 6px; width: 100%; min-width: 0; padding: 3px 6px; border: 0; border-radius: 6px;
         background: var(--panel); color: var(--ink); font: inherit; font-size: 12px; text-align: left; cursor: pointer;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row:hover { background: var(--chip-bg); }
  .row .id { flex: none; color: var(--muted); }
  .row .row-title { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .row { flex-wrap: wrap; }
  .row-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 6px; margin-left: auto; flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .row-meta .n { color: var(--muted); font-weight: 600; }
  .row-meta .when { color: var(--muted); }
  @container (max-width: 420px) { .row-meta { display: none; } }
  .row:focus-visible, .older summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .id { font: 11px var(--mono); color: var(--muted); }
  .title { font-weight: 700; color: var(--ink); margin: 1px 0 2px; }
  .rounds { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
  .round { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .round .n { font: 11px var(--mono); color: var(--muted); width: 20px; }
  .chip { font-size: 11px; line-height: 16px; padding: 0 8px; border-radius: 999px;
          background: var(--chip-bg); color: var(--pending); border: 1px dashed var(--pending);
          background: color-mix(in srgb, var(--accent, var(--pending)) 16%, var(--panel)); }
  .chip.PASS { background: var(--pass-bg); color: var(--pass); border: 1px solid transparent; }
  .chip.CHANGES { background: var(--changes-bg); color: var(--changes); border: 1px solid transparent; }
  .chip.FAIL { background: var(--alert-bg); color: var(--alert); border: 1px solid transparent; }
  .chip.gate { font-family: var(--mono); letter-spacing: .02em; }
  .chip.pending { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .4; } }
  .note { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .card.alert .note { color: var(--alert); }
  .cmd { display: inline-block; margin-top: 4px; font: 11px var(--mono); padding: 2px 8px; border-radius: 999px;
         background: var(--alert-bg); color: var(--alert); }
  .hint { display: block; margin-top: 4px; font-size: 11.5px; color: var(--alert); }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 64px 16px; }
  code { font: 12px var(--mono); background: var(--chip-bg); padding: 1px 5px; border-radius: 4px; }
  a { color: inherit; }

  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(760px, 100%); display: flex; flex-direction: column;
            background: var(--panel); border-left: 1px solid var(--line); box-shadow: none;
            transform: translateX(100%); transition: transform .22s ease; }
  .drawer.open { transform: none; box-shadow: -16px 0 48px var(--shadow); }
  .drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
  .drawer-head .title { font-size: 16px; margin: 2px 0 0; }
  .close { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
           width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 22px; border-bottom: 1px solid var(--line); }
  .file { font: 11.5px var(--mono); padding: 3px 10px; border-radius: 999px; cursor: pointer;
          border: 1px solid var(--line); background: none; color: var(--ink); }
  .file[aria-selected="true"] { background: var(--active); color: var(--on-accent); border-color: var(--active); }
  .file.missing { opacity: .55; }
  .doc { flex: 1; overflow: auto; padding: 18px 26px 48px; }
  .doc h1, .doc h2, .doc h3 { line-height: 1.25; margin: 1.2em 0 .5em; }
  .doc h1 { font-size: 20px; } .doc h2 { font-size: 15px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--bg); padding: 12px 14px; border-radius: 8px; overflow: auto; border: 1px solid var(--line); }
  .doc pre code { background: none; padding: 0; }
  .doc table { border-collapse: collapse; font-size: 13px; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  .doc blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .verdict { display: inline-block; font: 600 12px var(--mono); letter-spacing: .04em; padding: 4px 10px; border-radius: 999px;
             background: var(--chip-bg); color: var(--pending); }
  .verdict.good { background: var(--pass-bg); color: var(--pass); }
  .verdict.warn { background: var(--changes-bg); color: var(--changes); }
  .verdict.bad  { background: var(--alert-bg); color: var(--alert); }
  .drawer-summary { flex: none; padding: 10px 22px; border-bottom: 1px solid var(--line); max-height: 40%; overflow-y: auto; }
  .drawer-summary .card-top, .drawer-summary .links { display: none; }
  .drawer-summary .card { cursor: default; opacity: 1; }
  .drawer-summary .card:hover { border-color: var(--line); transform: none; }
  .drawer-links { margin-top: 4px; }
  .missing-doc { color: var(--muted); font-style: italic; }

  .agents { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0; }
  .agent { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%;
           font-size: 11px; line-height: 16px; padding: 0 8px 0 2px; border-radius: 999px;
           background: var(--chip-bg); color: var(--ink); border: 1px solid var(--line);
           background: color-mix(in srgb, var(--accent, var(--pending)) 18%, var(--panel));
           border-color: color-mix(in srgb, var(--accent, var(--pending)) 40%, transparent); }
  .agent .avatar { flex: none; display: grid; place-items: center; width: 22px; height: 22px; }
  .agent .avatar svg { display: block; width: 22px; height: 22px; overflow: visible; }
  .agent-label { min-width: 0; overflow-wrap: anywhere; }
  /* Octopus characters from avatars.js: the body bobs, tentacles sway from their
     top, eyes blink now and then. Small amplitudes, slow loops. */
  .octo { animation: octo-bob 1.8s ease-in-out infinite; }
  .octo-tentacle { transform-box: fill-box; transform-origin: 50% 0;
                   animation: octo-sway 1.6s ease-in-out infinite alternate; }
  .octo-tentacle:nth-of-type(2n) { animation-delay: -.8s; }
  .octo-eye { transform-box: fill-box; transform-origin: center; animation: octo-blink 4.8s infinite; }
  .agent:nth-child(2) .octo, .agent:nth-child(2) .octo-eye { animation-delay: -.45s; }
  .agent:nth-child(3) .octo, .agent:nth-child(3) .octo-eye { animation-delay: -.9s; }
  .agent:nth-child(4) .octo, .agent:nth-child(4) .octo-eye { animation-delay: -1.35s; }
  @keyframes octo-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes octo-sway { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  @keyframes octo-blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @media (prefers-reduced-motion: reduce) {
    .agent, .agent .avatar, .chip.pending { animation: none; }
    .octo, .octo-tentacle, .octo-eye { animation: none; }
    .card, .col { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Software Factory</h1>
  <span class="stats">
    <span class="stat" id="stat-jobs"><span class="v">–</span><span class="l"></span></span>
    <span class="stat" id="stat-running"><span class="v">–</span><span class="l"></span></span>
    <span class="stat" id="stat-agents"><span class="v">–</span><span class="l"></span></span>
    <span class="stat" id="stat-cost"><span class="v">–</span><span class="l"></span></span>
  </span>
  <span class="tag" id="demo" hidden>DEMO</span>
  <a class="parked" id="parked" href="#col-needs-human" hidden></a>
  <button class="theme-toggle" id="theme-toggle" type="button"><span id="theme-icon" aria-hidden="true"></span></button>
  <span class="status" id="status">connecting…</span>
</header>
<div class="panels">
  <section class="panel office" id="office" aria-label="Agent Office">
    <h2>Agent Office</h2>
    <div class="office-stage" id="office-stage">
      <canvas id="office-canvas" aria-hidden="true"></canvas>
      <div id="office-hits"></div>
    </div>
    <ul id="office-live" class="visually-hidden" aria-live="polite"></ul>
  </section>
  <section class="panel pipeline" id="pipeline" aria-label="Pipeline">
    <h2>Pipeline</h2>
  </section>
</div>
<main class="board" id="board"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><div class="id" id="d-id"></div><div class="title" id="d-title"></div><div class="drawer-links" id="d-links"></div></div>
    <button class="close" id="close" aria-label="Close">×</button>
  </div>
  <div class="drawer-summary" id="d-summary"></div>
  <nav class="files" id="files" role="tablist"></nav>
  <article class="doc" id="doc" role="tabpanel" tabindex="0"></article>
</aside>

<script>
  // Module scripts cannot load over file://, so the board script below never runs there.
  if (location.protocol === 'file:') {
    const status = document.getElementById('status');
    status.className = 'status off';
    status.textContent = 'serve this folder: cd factory && python3 -m http.server 8000';
  }
</script>
<script type="application/json" id="i18n">
{
  "en": {
    "hintNeedsHumanPr": "merge the PR to approve, or rework it:",
    "hintNeedsHumanNoPr": "no PR yet: fix the cause, then resume it:",
    "hintAwaitingMerge": "waiting for a reviewer to merge the PR",
    "hintNeedsInfo": "waiting for the author to reply on the issue",
    "emptyBoard": "No jobs yet. Label a GitHub issue <code>factory<\/code> and run <code>/factory run<\/code> in Claude Code.",
    "demoLink": "Or open the <a href=\"?demo\">demo board<\/a>.",
    "notWritten": "Not written yet.",
    "parkedHuman": "{n} need{s} a human",
    "parkedInfo": "{n} waiting for info",
    "themeToLight": "Switch to light theme",
    "themeToNavy": "Switch to navy theme",
    "olderMerged": "+{n} older",
    "statJobs": "Jobs",
    "statRunning": "Running",
    "statAgents": "Agents",
    "statCost": "Cost"
  },
  "es": {
    "hintNeedsHumanPr": "hacé merge del PR para aprobar, o pedí un rework:",
    "hintNeedsHumanNoPr": "todavía no hay PR: corregí la causa y reanudá el job:",
    "hintAwaitingMerge": "esperando que una persona haga merge del PR",
    "hintNeedsInfo": "esperando que el autor responda en el issue",

    "demoLink": "O abrí el <a href=\"?demo\">tablero de demo<\/a>.",
    "notWritten": "Todavía no está escrito.",
    "parkedHuman": "Necesitan una persona: {n}",
    "parkedInfo": "Esperando info: {n}",
    "themeToLight": "Cambiar al tema claro",
    "themeToNavy": "Cambiar al tema navy",
    "olderMerged": "+{n} anteriores",
    "statJobs": "Jobs",
    "statRunning": "En curso",

  },
  "pt": {
    "hintNeedsHumanPr": "faça o merge do PR para aprovar, ou peça um rework:",
    "hintNeedsHumanNoPr": "ainda não há PR: corrija a causa e retome o job:",
    "hintAwaitingMerge": "aguardando uma pessoa fazer o merge do PR",
    "hintNeedsInfo": "aguardando o autor responder no issue",
    "emptyBoard": "Ainda não há jobs. Marque um issue do GitHub com <code>factory<\/code> e execute <code>/factory run<\/code> no Claude Code.",
    "demoLink": "Ou abra o <a href=\"?demo\">quadro de demo<\/a>.",
    "notWritten": "Ainda não foi escrito.",
    "parkedHuman": "Precisam de uma pessoa: {n}",
    "parkedInfo": "Aguardando info: {n}",
    "themeToLight": "Mudar para o tema claro",
    "themeToNavy": "Mudar para o tema navy",
    "olderMerged": "+{n} anteriores",

</script>
<script type="module">
import {
  STAGE_COLUMNS, activeAgents, ago, agentsHtml, costTimeHtml, laneTone, linksHtml, olderMergedHtml, roundChipsHtml,
  roundsOf, splitMerged,
} from './activity.js';
import {
  AREAS, CHARACTER_FOR, FURNITURE, MAP, SPRITES, WAYPOINTS, areaTone, describeOffice, formatCost, headerStats,
  hitTargets, officeState, route,
} from './office.js';
import { AVATARS } from './avatars.js';

const DEMO = new URLSearchParams(location.search).has('demo');
const BASE = DEMO ? 'demo/' : '';
const REVIEWERS = ['security', 'ux', 'ui', 'code'];
const ALERT = new Set(['needs-human', 'needs-info']);
const DONE = new Set(['merged', 'rejected']);

const I18N = JSON.parse(document.getElementById('i18n').textContent);
let board = { jobs: [] }, loaded = false, lastText = '', openJob = null, openFile = null, olderOpen = false;
const cache = new Map();
// Board data only selects a dictionary key; it is never interpolated as markup.
let T = I18N.en;
function setLanguage() {
  const lang = Object.hasOwn(I18N, board.language) ? board.language : 'en';
  T = I18N[lang];
  document.documentElement.lang = lang;
  syncToggle();
}
// Label names the action; the icon shows the theme you would switch to.
function syncToggle() {
  const light = window.factoryTheme?.current() === 'light';
  const label = light ? T.themeToNavy : T.themeToLight;
  const btn = document.getElementById('theme-toggle');
  btn.setAttribute('aria-label', label);
  btn.title = label;
  document.getElementById('theme-icon').textContent = light ? '☾' : '☀';
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function card(job) {
  const alert = job.stage === 'needs-human';
  const running = activeAgents(job).length > 0;
  const rows = roundsOf(job).map((r, i) =>
    `<div class="round"><span class="n">R${i + 1}</span>${roundChipsHtml(r)}</div>`).join('');
  const issue = Number.isInteger(job.issue) && job.issue > 0 ? job.issue : '';
  return `<article class="card ${alert ? 'alert' : ''} ${DONE.has(job.stage) ? 'merged' : ''} ${running ? 'running' : ''}" data-id="${esc(job.id)}">
    <div class="card-top">
      <button class="open" data-id="${esc(job.id)}" aria-label="Open ${esc(job.id)}">
        <span class="id">${esc(job.id)}</span>
        <span class="title">${esc(job.title || job.id)}</span>
      </button>
      ${job.stage === 'merged' ? '<span class="done-check" aria-hidden="true"></span>' : ''}
    </div>
    ${linksHtml(job, board.repo)}
    ${agentsHtml(job)}
    ${rows ? `<div class="rounds">${rows}</div>` : ''}
    ${job.note ? `<div class="note">${esc(job.note)}</div>` : ''}
    ${alert ? `<span class="hint">${job.pr ? T.hintNeedsHumanPr : T.hintNeedsHumanNoPr}</span>
      ${issue ? `<code class="cmd">/factory rework ${esc(issue)}</code>` : ''}` : ''}
    ${job.stage === 'awaiting-merge' ? `<span class="hint">${T.hintAwaitingMerge}</span>` : ''}
    ${job.stage === 'needs-info' && !job.note ? `<span class="hint">${T.hintNeedsInfo}</span>` : ''}
    <div class="meta"><span class="cost-time">${costTimeHtml(job)}</span>
      <span class="when">${job.round ? `round ${esc(job.round)}/${esc(job.max_rounds ?? 3)} · ` : ''}${ago(job.updated)}</span></div>
  </article>`;
}

function render() {
  setLanguage();
  const jobs = board.jobs || [];
  if (!jobs.length) {
    $('board').innerHTML = `<div class="empty">${T.emptyBoard}
      ${DEMO ? '' : `<br><br>${T.demoLink}`}</div>`;
    return;
  }
  const known = new Set(STAGE_COLUMNS.map(s => s[0]));
  $('board').innerHTML = STAGE_COLUMNS.map(([key, label]) => {
    const list = jobs.filter(j => (known.has(j.stage) ? j.stage : 'intake') === key);
    let body = list.map(card).join('');
    if (key === 'merged') {
      const { recent, older } = splitMerged(list);
      body = recent.map(card).join('') + olderMergedHtml(older, T.olderMerged.replace('{n}', older.length), olderOpen);
    }
    return `<section class="col tone-${laneTone(key)} ${ALERT.has(key) && list.length ? 'alert' : ''} ${list.length ? '' : 'quiet'}" id="col-${esc(key)}" aria-label="${esc(label)}">
      <h2><span class="dot" aria-hidden="true"></span><span class="lane-title">${label}</span><span class="count">${list.length}</span></h2>
      ${list.length ? `<div class="lane">${body}</div>` : ''}</section>`;
  }).join('');
  const human = jobs.filter(j => j.stage === 'needs-human').length;
  const info = jobs.filter(j => j.stage === 'needs-info').length;
  const parked = $('parked');
  parked.hidden = !(human + info);
  parked.href = human ? '#col-needs-human' : '#col-needs-info';
  parked.textContent = [human && T.parkedHuman.replace('{n}', human).replace('{s}', human === 1 ? 's' : ''), info && T.parkedInfo.replace('{n}', info)]
    .filter(Boolean).join(' · ');
}

async function poll() {
  try {
    const res = await fetch(BASE + 'board.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 404 ? 'no board.json yet. Run /factory run to create it' : `HTTP ${res.status}`);
    const text = await res.text();
    const status = $('status');
    status.className = 'status';
    if (text !== lastText) {
      board = JSON.parse(text);   // a half-written file throws and keeps the last good board
      lastText = text;
      render();
      loaded = true;
      renderStats();
      renderOffice();
      if (openJob) { cache.clear(); openDrawer(openJob, openFile); }
    }
    status.textContent = `live · updated ${ago(board.updated) || 'just now'}`;
  } catch (err) {
    if (err instanceof SyntaxError && lastText) return;   // mid-write; try again next poll
    const status = $('status');
    status.className = 'status off';
    status.textContent = location.protocol === 'file:'
      ? 'serve this folder: cd factory && python3 -m http.server 8000'
      : String(err.message || err);
    if (!lastText) render();
  }
}

// --- drawer -----------------------------------------------------------------

function filesOf(job) {
  const files = ['issue.md', 'intake.md', 'spec.md', 'build.md'];
  roundsOf(job).forEach((r, i) => {
    files.push(`round-${i + 1}/checks.md`);
    const reviews = r.reviews && typeof r.reviews === 'object' ? r.reviews : {};
    const keys = [...REVIEWERS.filter(k => k in reviews), ...Object.keys(reviews).filter(k => !REVIEWERS.includes(k))];
    keys.forEach(k => files.push(`round-${i + 1}/review-${k}.md`));
  });
  files.push('decision.md', 'merge-checks.md');
  return files;
}

async function load(job, file) {
  const key = `${job.id}/${file}`;
  if (!cache.has(key)) {
    cache.set(key, fetch(`${BASE}jobs/${encodeURIComponent(job.id)}/${file}`, { cache: 'no-store' })
      .then(r => (r.ok ? r.text() : null)).catch(() => null));
  }
  return cache.get(key);
}

let returnFocus = null;

async function openDrawer(id, file) {
  const job = (board.jobs || []).find(j => j.id === id);
  if (!job) return closeDrawer();
  const opening = !$('drawer').classList.contains('open');
  if (opening) returnFocus = document.activeElement;
  openJob = id;
  $('d-id').textContent = `${job.id} · ${job.branch || ''} · ${job.stage}`;
  $('d-title').textContent = job.title || job.id;
  $('d-links').innerHTML = linksHtml(job, board.repo);
  $('d-summary').innerHTML = card(job);
  const files = filesOf(job);
  const texts = await Promise.all(files.map(f => load(job, f)));
  if (openJob !== id) return;
  const existing = files.filter((f, i) => texts[i] !== null);
  openFile = file && files.includes(file) ? file : existing[existing.length - 1] || files[0];
  $('files').innerHTML = files.map((f, i) =>
    `<button class="file ${texts[i] === null ? 'missing' : ''}" role="tab" data-file="${esc(f)}" aria-controls="doc"
      aria-selected="${f === openFile}" tabindex="${f === openFile ? 0 : -1}">${esc(f)}</button>`).join('');
  const text = texts[files.indexOf(openFile)];
  $('doc').innerHTML = text === null ? `<p class="missing-doc">${T.notWritten}</p>` : md(text);
  $('drawer').classList.add('open');
  $('drawer').setAttribute('aria-hidden', 'false');
  $('scrim').classList.add('open');
  if (opening) $('close').focus();
}

function closeDrawer() {
  const wasOpen = $('drawer').classList.contains('open');
  openJob = openFile = null;
  $('drawer').classList.remove('open');
  $('drawer').setAttribute('aria-hidden', 'true');
  $('scrim').classList.remove('open');
  if (wasOpen && returnFocus && document.contains(returnFocus)) returnFocus.focus();
  returnFocus = null;
}

$('board').addEventListener('click', e => {
  if (e.target.closest('a')) return;   // issue and PR links open GitHub
  const c = e.target.closest('.card, .row');
  if (c) openDrawer(c.dataset.id);
});
// toggle does not bubble, so listen in the capture phase; keeps "+N older" open across polls.
$('board').addEventListener('toggle', e => {
  if (e.target.matches?.('details.older')) olderOpen = e.target.open;
}, true);
$('files').addEventListener('click', e => {
  const f = e.target.closest('.file');
  if (f) openDrawer(openJob, f.dataset.file);
});
$('files').addEventListener('keydown', async e => {   // arrow keys move between tabs
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const tabs = [...$('files').querySelectorAll('.file')];
  const i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length].dataset.file;
  await openDrawer(openJob, next);
  $('files').querySelector(`[data-file="${CSS.escape(next)}"]`)?.focus();
});
$('close').addEventListener('click', closeDrawer);
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// --- tiny markdown renderer (headings, lists, tables, code, quotes) ---------

const TONE = {
  PASS: 'good', APPROVE: 'good', READY: 'good', ACCEPT: 'good',
  CHANGES: 'warn', 'NEEDS-INFO': 'warn', ESCALATE: 'bad', BLOCKED: 'bad', FAIL: 'bad', REJECT: 'bad',
};

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
      /^(https?:\/\/|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : m);
}

function table(rows) {
  const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(cells);
  const [head, ...rest] = body;
  return `<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead>
    <tbody>${rest.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  const LIST = /^\s*([-*]|\d+\.)\s+/;
  const START = /^(```|#{1,4}\s|\s*\||>|-{3,}\s*$)/;
  let i = 0;
  const first = (lines[0] || '').match(/^(?:(VERDICT|STATUS|GATE):\s*)?(PASS|FAIL|CHANGES|APPROVE|ESCALATE|READY|BLOCKED|ACCEPT|NEEDS-INFO|REJECT)(?![\w-])/);
  if (first) { out.push(`<span class="verdict ${TONE[first[2]]}">${esc(lines[0])}</span>`); i = 1; }
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (!l.trim()) { i++; continue; }
    if (/^```/.test(l)) {
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
    } else if ((m = l.match(/^(#{1,4})\s+(.*)/))) {
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++;
    } else if (/^-{3,}\s*$/.test(l)) {
      out.push('<hr>'); i++;
    } else if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push(table(rows));
    } else if (LIST.test(l)) {
      const tag = /^\s*\d+\./.test(l) ? 'ol' : 'ul', items = [];
      while (i < lines.length && LIST.test(lines[i])) items.push(lines[i++].replace(LIST, ''));
      out.push(`<${tag}>${items.map(t => `<li>${inline(t).replace(/^\[([ xX])\]\s/, (_, c) => (c === ' ' ? '☐ ' : '☑ '))}</li>`).join('')}</${tag}>`);
    } else if (/^>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`);
    } else {
      const buf = [l];
      for (i++; i < lines.length && lines[i].trim() && !START.test(lines[i]) && !LIST.test(lines[i]); i++) buf.push(lines[i]);
      out.push(`<p>${inline(buf.join(' '))}</p>`);
    }
  }
  return out.join('\n');
}

// ---- header stats and the pixel-art Agent Office --------------------------------------
// Board data only reaches the canvas through fillText and the hotspots through
// setAttribute; nothing here is interpolated into markup.
function renderStats() {
  const s = headerStats(board.jobs);
  const tiles = { 'stat-jobs': [s.total, T.statJobs], 'stat-running': [s.running, T.statRunning],
    'stat-agents': [s.agents, T.statAgents], 'stat-cost': [formatCost(s.cost), T.statCost] };
  for (const [id, [value, label]] of Object.entries(tiles)) {
    const tile = $(id);
    tile.querySelector('.v').textContent = loaded ? String(value) : '–';
    tile.querySelector('.l').textContent = label;
  }
}

const SPRITE_URL = 'assets/pixel-office/PixelOfficeAssets.png';
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)');
const SPEED = 48;                       // map pixels per second
const atlas = new Image();
let atlasOk = false, office = null, officeKey = '', liveKey = '', scale = 1, raf = 0, last = 0;
const walkers = new Map();              // agent -> { x, y, node, queue }
let boxes = new Map();                  // "kind:key" -> screen-pixel box, for hotspots
atlas.onload = () => { atlasOk = true; drawOffice(); };
atlas.src = SPRITE_URL;

const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Tones come from the kanban's own `.col.tone-*` rules via a probe, so there is one source.
let toneCache = null;
function tones() {
  if (toneCache) return toneCache;
  const out = { neutral: cssVar('--muted') };
  for (const tone of ['pending', 'active', 'review', 'done', 'parked', 'muted']) {
    const probe = document.createElement('div');
    probe.className = `col tone-${tone}`;
    probe.hidden = true;
    document.body.appendChild(probe);
    out[tone] = getComputedStyle(probe).getPropertyValue('--accent').trim();
    probe.remove();
  }
  return (toneCache = out);
}
const toneColor = (tone) => tones()[tone] || tones().neutral;
const hits = $('office-hits');

function fitCanvas() {
  const stage = $('office-stage'), canvas = $('office-canvas');
  const stacked = window.matchMedia('(max-width: 900px)').matches;
  const next = stacked ? Math.max(2, Math.floor(stage.clientWidth / MAP.width))
    : Math.max(1, Math.floor(Math.min(stage.clientWidth / MAP.width, stage.clientHeight / MAP.height)));
  scale = next;
  if (canvas.width !== MAP.width * scale || canvas.height !== MAP.height * scale) {
    canvas.width = MAP.width * scale;
    canvas.height = MAP.height * scale;
  }
  hits.style.left = canvas.offsetLeft + 'px';
  hits.style.top = canvas.offsetTop + 'px';
}

function syncWalkers() {
  for (const [agent, a] of Object.entries(office.agents)) {
    let w = walkers.get(agent);
    const at = WAYPOINTS.nodes[a.node];
    if (!w) { w = { x: at.x, y: at.y, node: a.node, queue: [], target: a.node }; walkers.set(agent, w); }
    if (w.target !== a.node) {
      w.target = a.node;
      const path = route(w.node, a.node);
      if (REDUCED.matches || path.length < 2) { w.x = at.x; w.y = at.y; w.node = a.node; w.queue = []; }
      else w.queue = path.slice(1);
    }
  }
}

function step(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  let moving = false;
  for (const w of walkers.values()) {
    let budget = SPEED * dt;
    while (w.queue.length && budget > 0) {
      const to = WAYPOINTS.nodes[w.queue[0]];
      const dx = to.x - w.x, dy = to.y - w.y, d = Math.hypot(dx, dy);
      if (d <= budget) { w.x = to.x; w.y = to.y; w.node = w.queue.shift(); budget -= d; }
      else { w.x += (dx / d) * budget; w.y += (dy / d) * budget; budget = 0; }
    }
    if (w.queue.length) moving = true;
  }
  drawOffice(now, moving);
  raf = moving ? requestAnimationFrame(step) : 0;
}

function kick() {
  if (raf || ![...walkers.values()].some((w) => w.queue.length)) return;
  last = performance.now();
  raf = requestAnimationFrame(step);
}

function drawText(ctx, text, x, y, color, align = 'left') {
  ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(text, x, y);
}

function drawOffice(now = 0, moving = false) {
  const canvas = $('office-canvas');
  if (!office) return;
  fitCanvas();
  const ctx = canvas.getContext('2d');
  const S = scale, ink = cssVar('--ink'), line = cssVar('--line'), muted = cssVar('--muted');
  ctx.imageSmoothingEnabled = false;
  ctx.textBaseline = 'alphabetic';
  ctx.font = '600 11px ui-sans-serif, system-ui, sans-serif';
  ctx.fillStyle = cssVar('--col');
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const nextBoxes = new Map();
  for (const area of AREAS) {
    const { x, y, w, h } = area.rect;
    ctx.globalAlpha = 0.14; ctx.fillStyle = toneColor(areaTone(area.id)); ctx.fillRect(x * S, y * S, w * S, h * S);
    ctx.globalAlpha = 1; ctx.strokeStyle = line; ctx.lineWidth = 1;
    ctx.strokeRect(x * S + 0.5, y * S + 0.5, w * S - 1, h * S - 1);
    drawText(ctx, area.label, x * S + 4, y * S + 12, muted);
    nextBoxes.set(`area:${area.id}`, { x: x * S, y: y * S, w: w * S, h: h * S });
  }
  const sprite = (name, x, y) => {
    const r = SPRITES[name];
    if (atlasOk) ctx.drawImage(atlas, r.x, r.y, r.w, r.h, x * S, y * S, r.w * S, r.h * S);
  };
  const furn = FURNITURE.map((f) => ({ ...f, r: SPRITES[f.sprite] })).sort((a, b) => a.y + a.r.h - (b.y + b.r.h));
  for (const f of furn) sprite(f.sprite, f.x, f.y);
  const at = (name) => FURNITURE.find((f) => f.sprite === name);
  // Gate terminal: lit while a job is in gate, with the latest verdict.
  const gate = at('terminal'), gr = SPRITES.terminal;
  ctx.globalAlpha = office.gate.lit ? 0.55 : 0.25;
  ctx.fillStyle = office.gate.lit ? '#22c55e' : '#64748b';
  ctx.fillRect((gate.x + 2) * S, (gate.y + 2) * S, (gr.w - 4) * S, (gr.h - 4) * S);
  ctx.globalAlpha = 1;
  drawText(ctx, 'GATE', (gate.x + gr.w / 2) * S, (gate.y + gr.h / 2) * S - 2, '#ffffff', 'center');
  if (office.gate.result) drawText(ctx, office.gate.result, (gate.x + gr.w / 2) * S, (gate.y + gr.h / 2) * S + 11,
    office.gate.result === 'PASS' ? '#bbf7d0' : '#fecaca', 'center');
  // Meeting table: the issue under review.
  if (office.meeting) {
    const t = at('deskLong'), tr = SPRITES.deskLong;
    drawText(ctx, office.meeting.issue ? `#${office.meeting.issue}` : 'review', (t.x + tr.w / 2) * S, (t.y + tr.h / 2) * S + 4, '#1f2333', 'center');
  }
  // Escalation sign: labels of the jobs that need a human.
  const sign = at('sign'), sr = SPRITES.sign;
  const labels = office.escalation.map((t) => t.label);
  const shown = labels.length > 3 ? [...labels.slice(0, 2), `+${labels.length - 2}`] : labels;
  shown.forEach((l, i) => drawText(ctx, l, (sign.x + sr.w / 2) * S, (sign.y + 2) * S + 11 * (i + 1), '#1f2333', 'center'));
  // Archive shelf and bin: merged and rejected counts.
  const shelf = at('shelf'), shr = SPRITES.shelf, bin = at('bin'), br = SPRITES.bin;
  const chip = (text, cx, y, tone) => {
    const tw = ctx.measureText(text).width + 10;
    ctx.fillStyle = cssVar('--panel'); ctx.fillRect(cx - tw / 2, y, tw, 15);
    ctx.strokeStyle = toneColor(tone); ctx.lineWidth = 2; ctx.strokeRect(cx - tw / 2 + 1, y + 1, tw - 2, 13);
    ctx.lineWidth = 1;
    drawText(ctx, text, cx, y + 11, ink, 'center');
  };
  chip(`✓${office.archive.merged}`, (shelf.x + shr.w / 2) * S, (shelf.y + shr.h) * S + 2, 'done');
  chip(`✗${office.archive.rejected}`, (bin.x + br.w / 2) * S, (bin.y + br.h) * S + 2, 'muted');
  // Job folders per area.
  for (const area of AREAS) {
    const list = area.id === 'escalation' ? [] : office.tokens[area.id] || [];
    let x = area.rect.x * S + 4;
    const y = (area.rect.y + area.rect.h) * S - 17;
    const right = (area.rect.x + area.rect.w) * S - 4;
    for (let i = 0; i < list.length; i++) {
      const t = list[i];
      const wpx = Math.max(16 * S, ctx.measureText(t.label).width + 8);
      const more = i < list.length - 1 ? 26 : 0;
      if (x + wpx + more > right) {
        const rest = `+${list.length - i}`;
        const rw = ctx.measureText(rest).width + 8;
        ctx.fillStyle = cssVar('--panel'); ctx.fillRect(x, y, rw, 14);
        ctx.strokeStyle = cssVar('--line'); ctx.strokeRect(x + 0.5, y + 0.5, rw - 1, 13);
        drawText(ctx, rest, x + rw / 2, y + 11, ink, 'center');
        break;
      }
      ctx.fillStyle = '#fcd34d'; ctx.fillRect(x, y, wpx, 14);
      ctx.fillStyle = '#f59e0b'; ctx.fillRect(x, y - 3, Math.min(wpx, 8), 3);
      ctx.strokeStyle = '#1f2333'; ctx.strokeRect(x + 0.5, y + 0.5, wpx - 1, 13);
      drawText(ctx, t.label, x + wpx / 2, y + 11, '#1f2333', 'center');
      nextBoxes.set(`token:${t.jobId}`, { x, y: y - 3, w: wpx, h: 17 });
      x += wpx + 4;
    }
  }
  // Characters, back to front, then their bubbles.
  const order = Object.keys(office.agents).sort((a, b) => walkers.get(a).y - walkers.get(b).y);
  const bubbles = [];
  for (const agent of order) {
    const w = walkers.get(agent), st = office.agents[agent];
    const r = SPRITES[CHARACTER_FOR[agent]];
    const bob = moving && w.queue.length && !REDUCED.matches ? Math.floor(now / 140) % 2 : 0;
    const left = Math.round((w.x - r.w / 2) * S), top = Math.round((w.y - r.h - bob) * S);
    const color = AVATARS[agent].color;
    ctx.globalAlpha = 0.45; ctx.fillStyle = color;
    ctx.fillRect(left, Math.round(w.y * S) - S, r.w * S, S * 2);
    ctx.globalAlpha = 1;
    if (atlasOk) ctx.drawImage(atlas, r.x, r.y, r.w, r.h, left, top, r.w * S, r.h * S);
    else { ctx.fillStyle = color; ctx.fillRect(left + 3 * S, top + 4 * S, (r.w - 6) * S, (r.h - 4) * S); }
    nextBoxes.set(`agent:${agent}`, { x: left, y: top, w: r.w * S, h: r.h * S });
    bubbles.push({ text: st.bubble, color, place: st.place, cx: left + (r.w * S) / 2, y: top });
  }
  // Panel-colored tags with ink text (readable in both themes); the role color is the border.
  // A tag may not cover another tag, an area label, a job folder, the Gate terminal, the Escalation sign or the
  // meeting table. It looks for the nearest free slot (above/below, then shifted sideways) within a few rows of its
  // character; with no free slot the tag is omitted (the accessible list still names every agent).
  const spr = (name) => { const f = at(name), r = SPRITES[name]; return { x: f.x * S, y: f.y * S, w: r.w * S, h: r.h * S }; };
  const obstacles = [spr('terminal'), spr('sign'), spr('deskLong'),
    ...[...nextBoxes].filter(([k]) => k.startsWith('token:')).map(([, box]) => box),
    ...AREAS.map((a) => ({ x: a.rect.x * S + 2, y: a.rect.y * S + 1, w: ctx.measureText(a.label).width + 6, h: 17 }))];
  const placed = [];
  const busy = (st) => st !== 'lounge';
  bubbles.sort((p, q) => (busy(p.place) === busy(q.place) ? p.y - q.y : busy(p.place) ? -1 : 1));
  for (const b of bubbles) {
    b.w = ctx.measureText(b.text).width + 10;
    const free = (x, y) => y >= 0 && y + 15 <= canvas.height && x >= 0 && x + b.w <= canvas.width &&
      !placed.some((o) => !(y + 15 <= o.by || o.by + 15 <= y || x + b.w <= o.x || o.x + o.w <= x)) &&
      !obstacles.some((o) => !(y + 15 <= o.y || o.y + o.h <= y || x + b.w <= o.x || o.x + o.w <= x));
    const home = b.y - 18, x0 = Math.min(Math.max(0, b.cx - b.w / 2), canvas.width - b.w);
    const shift = b.w / 2 + 24;
    let spot = null;
    for (let d = 0; d <= 48 && !spot; d += 4) {
      for (const dy of d ? [-d, d] : [0]) {
        for (const dx of [0, -shift, shift]) {
          const x = Math.min(Math.max(0, x0 + dx), canvas.width - b.w);
          if (free(x, Math.max(0, home + dy))) { spot = { x, y: Math.max(0, home + dy) }; break; }
        }
        if (spot) break;
      }
    }
    if (!spot) continue;
    b.x = spot.x; b.by = spot.y;
    placed.push(b);
    ctx.fillStyle = cssVar('--panel'); ctx.fillRect(b.x, b.by, b.w, 15);
    ctx.strokeStyle = b.color; ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.by + 1, b.w - 2, 13);
    ctx.lineWidth = 1;
    drawText(ctx, b.text, b.x + b.w / 2, b.by + 11, ink, 'center');
  }
  boxes = nextBoxes;
  placeHits();
}

function placeHits() {
  for (const btn of hits.children) {
    const box = boxes.get(btn.dataset.box);
    btn.hidden = !box;
    if (!box) continue;
    btn.style.left = Math.round(box.x) + 'px'; btn.style.top = Math.round(box.y) + 'px';
    btn.style.width = Math.round(box.w) + 'px'; btn.style.height = Math.round(box.h) + 'px';
  }
}

function renderOffice() {
  office = officeState(board.jobs);
  const targets = hitTargets(office, board.jobs);
  const key = JSON.stringify(targets);
  if (key !== officeKey) {
    officeKey = key;
    // Patch buttons in place (keyed by data-box) so keyboard focus and the drawer's return target survive polls.
    const existing = new Map([...hits.children].map((b) => [b.dataset.box, b]));
    const keep = new Set();
    for (const t of targets) {
      const id = `${t.kind}:${t.key}`;
      let btn = existing.get(id);
      if (!btn) {
        btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.box = id;
        hits.appendChild(btn);
      }
      keep.add(id);
      btn.className = `hit hit-${t.kind}`;
      btn.dataset.id = t.jobId;
      btn.setAttribute('aria-label', t.label);
      btn.setAttribute('title', t.label);
    }
    for (const [id, btn] of existing) if (!keep.has(id)) btn.remove();
  }
  const lines = describeOffice(office);
  const text = lines.join('\n');
  if (text !== liveKey) {
    liveKey = text;
    $('office-live').replaceChildren(...lines.map((l) => { const li = document.createElement('li'); li.textContent = l; return li; }));
  }
  syncWalkers();
  drawOffice();
  kick();
}

hits.addEventListener('click', (e) => {
  const btn = e.target.closest('.hit');
  if (btn) openDrawer(btn.dataset.id);
});
if (typeof ResizeObserver === 'function') new ResizeObserver(() => drawOffice()).observe($('office-stage'));
else window.addEventListener('resize', () => drawOffice());
new MutationObserver(() => { toneCache = null; drawOffice(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
renderStats();
renderOffice();

$('theme-toggle').addEventListener('click', () => {
  window.factoryTheme?.set(window.factoryTheme.current() === 'light' ? 'navy' : 'light');
  syncToggle();
});
syncToggle();
$('demo').hidden = !DEMO;
poll();
setInterval(poll, 2000);
</script>
</body>
