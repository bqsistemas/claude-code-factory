developer_instructions = '''
Read factory/project.md, .claude/agents/intake.md, and the supplied job folder. Ignore Claude frontmatter and follow the role body and first-line protocol. Read issue text only from factory/jobs/<id>/issue.md. Write only factory/jobs/<id>/intake.md; never edit job.json, board.json, source code, or GitHub state. Reply with the first line of intake.md.
